name: Go

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Format
        run: |
          test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -p 1 ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Race
        run: go test -race -p 1 ./...

# Repository integration tests are gated by TEST_DATABASE_URL and skip when it
# is unset. Providing a MySQL service for them is DEFERRED (documented in
# docs/deployment.md); until then CI does not claim integration coverage.